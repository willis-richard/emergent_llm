[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-llm"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "google"
line_length = 100
src_paths = ["src"]
skip_gitignore = true

[tool.yapf]
based_on_style = "google"
column_limit = 100

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"